<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Calendar Prep{% endblock %}</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        .todo-high { border-left: 4px solid #e53935; }
        .todo-medium { border-left: 4px solid #fb8c00; }
        .todo-low { border-left: 4px solid #43a047; }
        .event-card { cursor: pointer; transition: opacity 0.15s; }
        .event-card:hover { opacity: 0.85; }
        .event-meta { font-size: 0.875rem; color: var(--pico-muted-color); }
        nav .brand { font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <nav class="container">
        <ul><li><a href="/" class="brand">Calendar Prep</a></li></ul>
        <ul>
            {% if session.get('credentials') %}
            <li><a href="{{ url_for('events') }}">Events</a></li>
            <li><a href="{{ url_for('logout') }}">Logout</a></li>
            {% endif %}
        </ul>
    </nav>
    <main class="container">
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <article style="background: var(--pico-del-color); color: white; padding: 0.75rem 1rem;">
            {{ message }}
        </article>
        {% endfor %}
        {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
